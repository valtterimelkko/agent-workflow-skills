name: Secret scan

# Full-history scan. This repository is public and small (a curated skills
# collection), so a full `gitleaks git` scan on every push and pull request is
# cheap and catches anything that slipped in at any depth. Findings fail the
# job; triage them from metadata only and never print a matched value.
#
# Cost rules (owner): public-repo free runners only — `ubuntu-latest`, no larger
# or self-hosted runners, no crons, no `workflow_run` chains, bounded job.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the point of this job is to scan every commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          V=8.30.1
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o sums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" sums.txt | sed "s/gitleaks_${V}_linux_x64.tar.gz/gl.tgz/" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks git --redact --verbose .
